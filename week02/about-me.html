<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แนะนำตัว | ณัฐภัทร ณ ลำพูน</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        background:
          radial-gradient(ellipse at 18% 18%, #292929 0, transparent 35%),
          radial-gradient(ellipse at 85% 85%, #202020 0, transparent 32%),
          #090909;
        background-size: 150% 150%;
        color: #f5f5f5;
        font-family: "Segoe UI", Tahoma, sans-serif;
        animation: ambient-shift 16s ease-in-out infinite alternate;
      }

      .profile-card {
        position: relative;
        isolation: isolate;
        width: min(100%, 620px);
        overflow: hidden;
        padding: 42px 38px;
        border: 1px solid #383838;
        border-radius: 28px;
        background: linear-gradient(145deg, #1d1d1d, #101010 72%);
        text-align: center;
        box-shadow: 0 28px 80px rgb(0 0 0 / 55%);
        animation: card-enter 700ms ease-out;
        transition:
          transform 250ms ease,
          border-color 250ms ease,
          box-shadow 250ms ease;
      }

      .profile-card::before {
        position: absolute;
        z-index: -1;
        top: 0;
        left: 12%;
        width: 76%;
        height: 1px;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        content: "";
        animation: soft-glint 3s ease-in-out infinite alternate;
      }

      .profile-card:hover {
        transform: translateY(-6px);
        border-color: #666;
        box-shadow: 0 36px 90px rgb(0 0 0 / 70%);
      }

      .portrait-frame {
        position: relative;
        display: grid;
        width: 220px;
        height: 220px;
        margin: 0 auto 28px;
        place-items: center;
        border-radius: 50%;
        animation: photo-enter 800ms ease-out;
        transition: transform 350ms ease;
      }

      .portrait-frame::before,
      .portrait-frame::after {
        position: absolute;
        border-radius: 50%;
        content: "";
        pointer-events: none;
      }

      .portrait-frame::before {
        inset: 0;
        border: 2px solid transparent;
        border-top-color: #fff;
        border-right-color: #888;
        filter: drop-shadow(0 0 8px rgb(255 255 255 / 28%));
        animation: ring-spin 4s linear infinite;
      }

      .portrait-frame::after {
        inset: 7px;
        border: 1px dashed rgb(255 255 255 / 20%);
        animation: ring-spin 24s linear infinite reverse;
      }

      .profile-photo {
        display: block;
        width: 180px;
        height: 180px;
        border: 3px solid #f5f5f5;
        border-radius: 50%;
        background: #222;
        object-fit: cover;
        object-position: center 38%;
        box-shadow:
          0 0 0 8px rgb(255 255 255 / 5%),
          0 12px 36px rgb(0 0 0 / 45%);
        animation: photo-glow 3s ease-in-out 800ms infinite alternate;
      }

      .profile-card:hover .portrait-frame {
        transform: translateY(-4px) scale(1.04);
      }

      .profile-content {
        padding: 12px 0 0;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 14px;
        color: #bdbdbd;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .eyebrow::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 0 10px rgb(255 255 255 / 80%);
        content: "";
      }

      h1 {
        margin: 0 0 16px;
        color: #fff;
        font-size: clamp(1.8rem, 6vw, 2.5rem);
        letter-spacing: 0.015em;
        text-shadow:
          0 2px 2px rgb(0 0 0 / 70%),
          0 0 24px rgb(255 255 255 / 18%);
      }

      h1::after {
        display: block;
        width: 0;
        height: 2px;
        margin: 12px auto 0;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        content: "";
        animation: underline-reveal 700ms 500ms ease-out forwards;
      }

      .introduction {
        max-width: 440px;
        margin: 0 auto;
        color: #c4c4c4;
        font-size: 1rem;
        line-height: 1.8;
      }

      .details {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }

      .detail {
        padding: 9px 14px;
        border: 1px solid #414141;
        border-radius: 999px;
        background: #181818;
        color: #e5e5e5;
        font-size: 0.9rem;
        transition:
          color 200ms ease,
          background-color 200ms ease,
          transform 200ms ease;
      }

      .detail:hover {
        transform: translateY(-2px);
        background: #f5f5f5;
        color: #111;
      }

      @keyframes card-enter {
        from {
          transform: translateY(18px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes ambient-shift {
        from {
          background-position: 0 0, 100% 100%, 0 0;
        }

        to {
          background-position: 100% 40%, 0 60%, 0 0;
        }
      }

      @keyframes soft-glint {
        from {
          opacity: 0.3;
          transform: scaleX(0.85);
        }

        to {
          opacity: 0.8;
          transform: scaleX(1);
        }
      }

      @keyframes ring-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes photo-enter {
        from {
          transform: scale(0.85);
          opacity: 0;
        }

        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      @keyframes photo-glow {
        from {
          filter: drop-shadow(0 0 3px rgb(255 255 255 / 15%));
        }

        to {
          filter: drop-shadow(0 0 13px rgb(255 255 255 / 42%));
        }
      }

      @keyframes underline-reveal {
        to {
          width: 72px;
        }
      }

      @media (max-width: 520px) {
        .profile-card {
          padding: 34px 22px;
          border-radius: 22px;
        }

        .portrait-frame {
          width: 188px;
          height: 188px;
        }

        .profile-photo {
          width: 154px;
          height: 154px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        body {
          animation: none;
        }

        .profile-card {
          animation-duration: 350ms;
        }

        .profile-card::before,
        .profile-photo {
          animation: none;
        }

        .portrait-frame {
          animation-duration: 350ms;
        }

        .portrait-frame::before {
          animation-duration: 12s;
        }

        .portrait-frame::after {
          animation-duration: 36s;
        }

        h1::after {
          animation-duration: 350ms;
        }

        * {
          transition-duration: 120ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="profile-card">
      <div class="portrait-frame">
        <img
          class="profile-photo"
          src="nattaphat-profile.png"
          alt="ณัฐภัทรกำลังเล่นกีตาร์"
        />
      </div>
      <section class="profile-content" aria-labelledby="profile-name">
        <p class="eyebrow">ยินดีที่ได้รู้จักครับ</p>
        <h1 id="profile-name">นายณัฐภัทร ณ ลำพูน</h1>
        <p class="introduction">
          สวัสดีครับ ผมชื่อณัฐภัทร ปัจจุบันกำลังศึกษาอยู่ชั้นปีที่ 1
          สาขาวิทยาการคอมพิวเตอร์
        </p>
        <div class="details" aria-label="ข้อมูลส่วนตัว">
          <span class="detail">อายุ 19 ปี</span>
          <span class="detail">รหัสนักศึกษา 69122420021</span>
          <span class="detail">นักศึกษาชั้นปีที่ 1</span>
          <span class="detail">สาขาวิทยาการคอมพิวเตอร์</span>
        </div>
      </section>
    </main>
  </body>
</html>
